#
# Use the following Ruby code to generate your rootpw hash:
#   ruby -r 'digest/sha2' -e 'puts "password".crypt("$6$" + rand(36**8).to_s(36))'
#
# Use the following command to generate your grub password hash:
#   grub2-mkpasswd-pbkdf2
#
# Replace the following strings in this file:
#
#     #BOOTPASS#  - Your hashed bootloader password
#     #ROOTPASS#  - Your hashed root password
#     #KSSERVER#  - The IP address of your Kickstart server
#     #YUMSERVER# - The IP address of your YUM server
#     #LINUXDIST# - The LINUX Distribution you are kickstarting
#                 - Current CASE SENSITIVE options: RedHat CentOS
#
# This kickstart file targets RHEL/CentOS 9.
#
# On some EL versions (notably 7.0-7.4), anaconda had a known issue, where
# installation images did not support FIPS mode (fips=1) when the kickstart file
# (this file) is loaded from an HTTPS source.
#
# Details:
#
#   - https://access.redhat.com/errata/RHBA-2018:0947
#   - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/7/html/7.5_release_notes
#   - https://bugzilla.redhat.com/show_bug.cgi?id=1341280
#   - https://groups.google.com/forum/?fromgroups#!topic/simp-announce/3pBQDZl1OVc
#
# If this affects your OS, remove the `fips=1 ` string from the bootloader
# line's `--append` argument below (this will not affect the FIPS Mode of the
# final system):
bootloader --location=mbr --append="fips=1 console=ttyS1,57600 console=tty1" --iscrypted --password=#BOOTPASS#
## Remove the `--location=mbr` option from the above bootloader line if booting UEFI

rootpw --iscrypted #ROOTPASS#
firewall --enabled --ssh
# Anaconda defaults to America/New_York when no timezone is given, so a
# PXE-kickstarted client came up in EDT and stayed there until its first
# successful puppet run reset it. ks/dvd/include/common_ks_base already sets
# `timezone --utc GMT` for the DVD installs; this file does not include it.
# --utc also tells anaconda the RTC is UTC, which matters for skew.
timezone --utc UTC
firstboot --disable
# EL9: `logging --level` is deprecated (pykickstart marks it deprecated=F34)
# and warns on every install; it is also a no-op here since 'info' is already
# the default. Deprecated kickstart options are usually removed within a
# release or two, and `inst.ksstrict` turns the warning into a hard error, so
# the option is dropped. Bare `logging` matches ks/dvd/include/common_ks_base.
logging
selinux --enforcing

text
zerombr
clearpart --none --initlabel
%include /tmp/part-include
skipx
%include /tmp/repo-include

keyboard us
lang en_US
url --noverifyssl --url=https://#YUMSERVER#/yum/#LINUXDIST#/9/x86_64

network --bootproto=dhcp
reboot

%packages
-sendmail
acl
aide
bzip2
chrony
crontabs
## FIPS on EL9 is driven solely by FIPS=true/false in the %post section below.
## dracut-fips and fipscheck no longer exist -- the dracut package ships the
## FIPS dracut module (/usr/lib/dracut/modules.d/01fips) itself.
dracut
git
grub2-efi-x64
iptables-nft
irqbalance
libaio
libutempter
logrotate
logwatch
lsof
lsscsi
mdadm
microcode_ctl
s-nail
net-snmp
net-tools
netlabel_tools
pciutils
psacct
quota
rsync
rsyslog
shim-x64
smartmontools
sssd
stunnel
sudo
sysstat
tmpwatch
unzip
usbutils
vim-enhanced
wget
which
zip
# Puppet stuff
openvox-agent
# In case of broken repo, these should be installed.
hdparm
kbd
policycoreutils
rootfiles
selinux-policy-targeted
setserial
sysfsutils
# Don't install these
-rhn-check
-rhn-setup
-rhnsd
-subscription-manager
%end

%pre
ksserver="#KSSERVER#"
yumserver="#YUMSERVER#"

# Fetch disk and repo detection scripts from kickstart server and run them
# to create the files used by the'%include /tmp/*-include' above.
#
# curl, not wget: wget cannot do HTTPS in the EL9 installer environment. It is
# present and linked against libgnutls.so.30, and the library is in the image,
# but TLS fails to initialise there -- wget exits 4 (network failure) without
# ever opening a connection, and --no-check-certificate does not help because
# the failure is in library init, not certificate validation. Measured on a real
# PXE install: the server's access_log recorded no request at all from wget,
# while curl succeeded from the same script microseconds later.
#
# Symptom if this regresses: %pre appears to run, then the install dies with
#   Unable to open input kickstart file: ... '/tmp/part-include'
# because neither detection script was ever downloaded.
curl -sSk -o /tmp/diskdetect.sh https://$ksserver/ks/diskdetect.sh
/bin/sh /tmp/diskdetect.sh

curl -sSk -o /tmp/repodetect.sh https://$ksserver/ks/repodetect.sh
/bin/sh /tmp/repodetect.sh '9' "$yumserver" '#LINUXDIST#'

%end

%post --nochroot --erroronfail

SYSIMAGE="/mnt/sysimage"

# If we dropped a LUKS key-file, we need to copy it into place.
if [ -f /boot/disk_creds ]; then
  cp /boot/disk_creds $SYSIMAGE/etc/.cryptcreds
  chown root:root $SYSIMAGE/etc/.cryptcreds
  chmod 400 $SYSIMAGE/etc/.cryptcreds

  crypt_disk=`cat /boot/crypt_disk`
  for x in /dev/$crypt_disk*; do
    if `cryptsetup isLuks $x`; then
      crypt_partition="$x"
      break
    fi
  done

  if [ -z "$crypt_partition" ]; then
    echo "Error: Could not find the encrypted partition"
    exit 1
  fi

  exec < /dev/tty6 > /dev/tty6 2> /dev/tty6
  chvt 6

  echo "Updating the LUKS keys, this may take some time...."

  # EL9: the keyslot must end up pbkdf2, not argon2id.
  #
  # anaconda accepts `part ... --encrypted --pbkdf=pbkdf2` and records it in
  # anaconda-ks.cfg, but the keyslot still comes out argon2id -- EL9 cryptsetup
  # defaults LUKS2 keyslots to Argon2id, which is not FIPS-approved. FIPS mode
  # then refuses:
  #
  #   The following encrypted devices use Argon2 PBKDF: /dev/sdaN(luks-...)
  #   Aborting fips-mode-setup because of that.
  #
  # luksChangeKey both lands the keyfile in slot 0 (which is why this step
  # existed at all) and converts the PBKDF, so it replaces the old EL6-era
  # add/kill dance. Matches ks/dvd/auto.cfg, which is proven on this media.
  cryptsetup luksChangeKey --pbkdf pbkdf2 --key-slot 0 --key-file /boot/disk_creds $crypt_partition /boot/disk_creds

  # Prove it rather than shipping a box that reports an inconsistent FIPS state.
  slot_pbkdf=`cryptsetup luksDump $crypt_partition | sed -n '/^Keyslots:/,/^Tokens:/p' | awk '/PBKDF:/ {print $2; exit}'`
  if [ "$slot_pbkdf" != "pbkdf2" ]; then
    echo "ERROR: LUKS keyslot PBKDF is '$slot_pbkdf', expected 'pbkdf2' -- fips-mode-setup will abort"
    exit 1
  fi
  echo "LUKS keyslot PBKDF is pbkdf2"

  # Modify the crypttab file
  crypt_uuid=`cryptsetup luksDump ${crypt_partition} | grep UUID | sed 's/[[:space:]]\+/ /g' | cut -f2 -d' '`

  chvt 1
  exec < /dev/tty1 > /dev/tty1 2> /dev/tty1

  # If we got here, and this is blank, fail hard!
  if [ -z "$crypt_uuid" ]; then
    echo "Error: Could not find crypt_uuid"
    exit 1
  fi

  echo "luks-${crypt_uuid} UUID=${crypt_uuid} /etc/.cryptcreds luks" > $SYSIMAGE/etc/crypttab
fi
%end

%post

# Disable all the (internet-only) .repo files CentOS kickstarts install
if [ -f /etc/centos-release ]; then
  sed -i -e '/enabled=/d' -e 's/^\(\[.*\]\)/\1\nenabled=0/g' \
    /etc/yum.repos.d/CentOS-*.repo
fi

## Change this to false if you do not want FIPS mode. On EL9 this is the only
## switch -- fips-mode-setup below does the work and the dracut package already
## carries the FIPS dracut module.
##
FIPS=true

# In EL8 the bios kickstart was failing because the boot=UUID  kernel parameter
# is not being set.  In FIPs mod it will create a new Boot menu item
# with fips=1, in non fips mode it will update the existing default entry.
# Also, if you are booting fips and you have a seperate boot partition you must set boot=

# In case you need a working fallback
BOOTDEV=`df /boot | tail -1 | cut -f1 -d' '`
BOOTUUID=`blkid ${BOOTDEV} -o export | grep ^UUID`
DEFAULT_KERNEL_INFO=$(basename $(/sbin/grubby --default-kernel))
# EL9: grubby --info prints shell-quoted values, e.g.
#     initrd="/boot/initramfs-5.14.0-....img"
# Cutting on '=' keeps both quotes; basename strips the leading one along with
# the path but leaves the TRAILING quote attached, producing a BLS entry reading
#     initrd /boot/initramfs-5.14.0-....img"
# grub then cannot find the initramfs, boots the kernel with none, and the
# system panics on first boot with
#     VFS: Unable to mount root fs on unknown-block(0,0)
# with no LUKS unlock and no LVM activation. Measured on a real PXE install.
# Anchor the grep, keep everything after the first '=', and strip the quotes.
DEFAULT_INITRD=$(basename $(/sbin/grubby --info=DEFAULT | grep '^initrd=' | head -1 | cut -f2- -d'=' | tr -d '"'))
DEFAULT_KERNEL_TITLE=`/sbin/grubby --default-title`

if $FIPS; then
  FIPS_SETTING=1
  /sbin/grubby --copy-default --make-default \
    --add-kernel=${DEFAULT_KERNEL_INFO} \
    --initrd=${DEFAULT_INITRD} \
    --title="FIPS ${DEFAULT_KERNEL_TITLE}"
else
   FIPS_SETTING=0
fi
# Replace fips= in boot command line.
/sbin/grubby --remove-args="fips" --update-kernel=DEFAULT
/sbin/grubby --args="boot=${BOOTUUID} fips=${FIPS_SETTING}" --update-kernel=DEFAULT

# For the disk crypto
if [ -f "/etc/.cryptcreds" ]; then
  echo 'install_items+=" /etc/.cryptcreds "' >> /etc/dracut.conf
fi

for x in `ls -d /lib/modules/*`; do
  installed_kernel=`basename $x`
  dracut -f "/boot/initramfs-${installed_kernel}.img" $installed_kernel
done

if $FIPS; then
  /usr/bin/fips-mode-setup --enable
else
  /usr/bin/fips-mode-setup --disable
fi

ksserver="#KSSERVER#"

echo "Welcome to SIMP!  If this is firstboot, SIMP bootstrap is scheduled to run.
If this host is not autosigned by Puppet, sign your Puppet certs to begin bootstrap.
Otherwise, it should already be running! Tail /root/puppet.bootstrap.log for details.
Wait for completion and reboot.

To remove this message, delete /root/.bootstrap_msg" > /root/.bootstrap_msg
sed -i "2i if [ -f /root/.bootstrap_msg ]\nthen\n  cat /root/.bootstrap_msg\nfi" /root/.bashrc
source /root/.bashrc

# Enable wait-online
systemctl enable NetworkManager-wait-online

# Enable the firstboot bootstrapping script.
#
# curl, not wget -- same reason as %pre, and confirmed to bite here too. On a
# real EL9 install these two wget calls produced no request at all in the
# kickstart server's access_log, so the unit and the bootstrap script were never
# written and the node came up fully installed but never enrolled with Puppet.
# Note this runs after `fips-mode-setup --enable` above, which is the likeliest
# reason wget's GnuTLS path fails here as well.
#
# Symptom if this regresses: the host boots and pings fine, but never appears in
# `puppetserver ca list --all` and /root/puppet.bootstrap.log never exists.
curl -sSk \
  -o /etc/systemd/system/simp_client_bootstrap.service \
  https://$ksserver/ks/simp_client_bootstrap.service
chmod 644 /etc/systemd/system/simp_client_bootstrap.service
curl -sSk \
  -o /usr/local/sbin/bootstrap_simp_client \
  https://$ksserver/ks/bootstrap_simp_client
chmod 700  /usr/local/sbin/bootstrap_simp_client

systemctl enable simp_client_bootstrap.service
%end
