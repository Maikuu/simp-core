default simp
prompt 1
display boot.msg
label simp
  kernel vmlinuz
  append inst.ks=cdrom:/dev/cdrom:/ks/dvd/auto.cfg initrd=initrd.img simp_disk_crypt simp_install=auto
label simp-nocrypt
  kernel vmlinuz
  append inst.ks=cdrom:/dev/cdrom:/ks/dvd/auto.cfg initrd=initrd.img simp_install=auto
label simp-prompt
  kernel vmlinuz
  append inst.ks=cdrom:/dev/cdrom:/ks/dvd/auto.cfg initrd=initrd.img simp_opt=prompt simp_install=auto
label linux-min
  kernel vmlinuz
  append inst.ks=cdrom:/dev/cdrom:/ks/dvd/min.cfg initrd=initrd.img simp_disk_crypt simp_install=auto
label linux-min-nocrypt
  kernel vmlinuz
  append inst.ks=cdrom:/dev/cdrom:/ks/dvd/min.cfg initrd=initrd.img simp_install=auto
# Rescue / troubleshooting. SIMP's isolinux.cfg replaces the stock RHEL menu,
# which removes Red Hat's "Troubleshooting > Rescue a system" entry. Without
# this there is no way to recover an installed system from SIMP media.
label rescue
  kernel vmlinuz
  append initrd=initrd.img inst.rescue
label rescue-nomount
  kernel vmlinuz
  append initrd=initrd.img inst.rescue inst.rescue_nomount

label local
  localboot 0
label memtest86
  kernel memtest
  append -

